name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format (rustfmt defaults)
        run: cargo fmt --check

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Fetch vendored runtime (scrcpy v5.0.1, SHA256-pinned)
        shell: pwsh
        run: ./scripts/fetch-vendor.ps1

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $stage = "dist/DroidRescue-$version-win-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/droidrescue.exe "$stage/DroidRescue.exe"
          Copy-Item docs/使用说明.txt $stage
          7z a -t7z -m0=lzma2 -mx=9 -mfb=273 -md=64m -ms=on "dist/DroidRescue-$version-win-x64.7z" "./$stage/*"
          7z a -tzip -mm=Deflate -mx=9 -mfb=258 -mpass=15 "dist/DroidRescue-$version-win-x64.zip" "./$stage/*"
          # The in-app updater downloads the bare exe (everything is embedded).
          Copy-Item target/release/droidrescue.exe "dist/DroidRescue-$version-win-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: DroidRescue-windows-x64
          path: |
            dist/*.7z
            dist/*.zip
            dist/*.exe

  macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format (rustfmt defaults)
        run: cargo fmt --check

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Fetch vendored runtime (scrcpy v5.0.1, SHA256-pinned)
        run: sh scripts/fetch-vendor.sh

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (includes a real VideoToolbox decode)
        run: cargo test

      - name: Package (.app + .dmg)
        run: sh scripts/package-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: DroidRescue-macos-arm64
          path: |
            dist/*.dmg
            dist/*.app.zip

  # Tag `vX.Y.Z` → GitHub Release with every platform's package. Runs only
  # after both platforms built and passed their tests.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat notes.md

      # A draft: a maintainer smoke-tests the attached builds on real
      # devices, then presses "Publish" — nothing unverified goes public.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "安卓救援宝 DroidRescue $GITHUB_REF_NAME" \
            --notes-file notes.md
