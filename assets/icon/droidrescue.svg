<?xml version="1.0" encoding="UTF-8"?>
<!-- 安卓救援宝 DroidRescue app icon (source of truth; scripts/make-icons.sh
     renders the .ico / .icns / .png from it). 1024 grid, macOS tile inset. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2E33"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2125"/>
      <stop offset="1" stop-color="#0A0B0C"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Device -->
  <rect x="300" y="210" width="400" height="604" rx="64" fill="url(#screen)"
        stroke="#FFB224" stroke-width="40"/>
  <!-- Crack across the screen -->
  <polyline points="604,262 548,388 600,436 486,566 530,610 418,742"
            fill="none" stroke="#FFC65C" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="548,388 452,420" fill="none" stroke="#FFC65C" stroke-opacity="0.7"
            stroke-width="12" stroke-linecap="round"/>

  <!-- Rescue badge -->
  <circle cx="704" cy="716" r="158" fill="#121417"/>
  <circle cx="704" cy="716" r="132" fill="#FFB224"/>
  <rect x="682" y="636" width="44" height="160" rx="12" fill="#121417"/>
  <rect x="624" y="694" width="160" height="44" rx="12" fill="#121417"/>
</svg>
